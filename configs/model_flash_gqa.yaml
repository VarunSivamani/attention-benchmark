# 124M GPT-style model: Kronecker embeddings + Flash Attention + GQA

model:
  vocab_size: 50257                  # GPT-2 BPE via tiktoken
  n_layer: 12
  n_embd: 768
  n_head: 12
  n_kv_head: 4                       # 3:1 GQA ratio (query heads : KV heads)
  block_size: 8192                   # max sequence length during training
  pos_dim: 16                        # Kronecker embedding position dimension
  attention_type: "flash_gqa"        # differentiating factor: Flash Attention + GQA
  dropout: 0.1
  bias: false
  norm_eps: 1e-6

training:
  batch_size_tokens: 524288          # ~512K tokens/step (adjust per GPU VRAM)
  learning_rate: 6e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_tokens: 2000000000          # 2B tokens warmup
  gradient_accumulation_steps: 1     # cumulative effect depends on batch_size_tokens

curriculum:
  stages:
    - seq_len: 2048
    - seq_len: 4096
    - seq_len: 8192

# Token budget per stage (overridable via CLI --tokens-per-stage or TOKENS_PER_STAGE env)
tokens_per_stage: [2000000000, 3000000000, 5000000000]  # 2B, 3B, 5B (total ~10B for ~1 epoch)

# Logging & checkpointing
logging:
  log_interval_steps: 50
  eval_interval_steps: 500
  save_interval_tokens: 1000000000   # save after each 1B tokens
  checkpoint_dir: "runs/flash_gqa"
  metrics_file: "runs/flash_gqa/metrics.jsonl"
  eval_file: "runs/flash_gqa/eval.jsonl"

# Data loading
data:
  dataset_repo: null                 # read from HF_DATASET_REPO env var
  shard_cache_dir: null              # read from SHARD_CACHE_DIR env var or default to ~/.cache/fineweb-edu-shards
  num_workers: 4                     # DataLoader workers
  prefetch_factor: 2
